name: FAM new-site local image assets
on:
  push:
    paths:
      - ".github/workflows/fam-new-site-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download concept photography into the repository
        run: python3 new-site/fetch-assets.py
      - name: Commit images only if valid images were saved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-site/assets/*.jpg
          if ! git diff --staged --quiet; then
            git commit -m "Add self-hosted cinematic images for new FAM website"
            git push
          else
            echo "No new photos were downloaded."
          fi
