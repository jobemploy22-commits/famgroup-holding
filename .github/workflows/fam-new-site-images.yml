name: Install photos for independent FAM website
on:
  push:
    paths:
      - '.github/workflows/fam-new-site-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and store local visual assets
        shell: bash
        run: |
          set -eu
          mkdir -p new-site/assets
          python3 - <<'PY'
          import urllib.request,time,pathlib
          base="https://images.unsplash.com/"
          assets={
            "hero.jpg":("photo-1486406146926-c627a92ad1ab",1800),
            "construction.jpg":("photo-1600585154340-be6161a56a0c",1000),
            "capital.jpg":("photo-1611974789855-9c2a0a7236a3",1000),
            "technology.jpg":("photo-1518770660439-4636190af475",1000),
            "ventures.jpg":("photo-1416879595882-3373a0480b5b",1000),
            "project-a.jpg":("photo-1600585154340-be6161a56a0c",1100),
            "project-b.jpg":("photo-1486406146926-c627a92ad1ab",1100),
            "project-c.jpg":("photo-1600607687939-ce8a6c25118c",1100),
            "tehran.jpg":("photo-1767607985306-30a2607d2d36",1600),
          }
          errors=[]
          for filename,(photo,width) in assets.items():
              target=pathlib.Path("new-site/assets")/filename
              url=f"{base}{photo}?auto=format&fit=crop&w={width}&q=78&fm=jpg"
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (FAM GROUP website assets)"})
                      with urllib.request.urlopen(req,timeout=35) as response:
                          data=response.read()
                      if len(data)<2000 or data[:2]!=b'\xff\xd8':
                          raise ValueError(f"not JPEG: {len(data)} bytes")
                      target.write_bytes(data)
                      print(filename,len(data))
                      break
                  except Exception as exc:
                      print(filename,"try",attempt+1,str(exc))
                      if attempt==2: errors.append(filename)
                      time.sleep(attempt+1)
          if errors:
              print("Some images failed and will use built-in visual fallbacks:",errors)
          PY
      - name: Commit image assets to repository
        shell: bash
        run: |
          git config user.name "FAM Design Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-site/assets/
          if git diff --cached --quiet; then
            echo "No images were downloaded"
            exit 0
          fi
          git commit -m "Add hosted photo assets for new FAM GROUP site"
          git push
