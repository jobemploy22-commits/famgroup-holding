name: FAM editorial hero refresh
on:
  push:
    paths:
      - ".github/workflows/fam-hero-photo.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace bright interior hero with cinematic architectural dusk photography
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          url="https://images.pexels.com/photos/2083715/pexels-photo-2083715.jpeg?auto=compress&cs=tinysrgb&w=1800"
          req=Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urlopen(req,timeout=40) as f:
              data=f.read()
              print("Status",f.status,"mime",f.headers.get("Content-Type"),"bytes",len(data))
          assert data[:3]==b"\xff\xd8\xff" and len(data)>10000
          Path("new-site/assets/hero.jpg").write_bytes(data)
          PY
      - name: Commit locally hosted dusk hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-site/assets/hero.jpg
          if ! git diff --staged --quiet; then
            git commit -m "Replace interior hero with cinematic high-rise at dusk"
            git push
          fi
